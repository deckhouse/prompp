version: "2"
run:
  build-tags:
    - static
linters:
  enable:
    - depguard
    - errorlint
    - gocritic
    - godot
    - gosec
    - loggercheck
    - misspell
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - testifylint
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/go-kit/kit/log
              desc: Use github.com/go-kit/log instead of github.com/go-kit/kit/log
            - pkg: io/ioutil
              desc: Use corresponding 'os' or 'io' functions instead.
            - pkg: regexp
              desc: Use github.com/grafana/regexp instead of regexp
            - pkg: github.com/pkg/errors
              desc: Use 'errors' or 'fmt' instead of github.com/pkg/errors
            - pkg: gzip
              desc: Use github.com/klauspost/compress instead of gzip
            - pkg: zlib
              desc: Use github.com/klauspost/compress instead of zlib
            - pkg: golang.org/x/exp/slices
              desc: Use 'slices' instead.
    errcheck:
      exclude-functions:
        # Don't flag lines such as "io.Copy(io.Discard, resp.Body)".
        - io.Copy
        # The next two are used in HTTP handlers, any error is handled by the server itself.
        - io.WriteString
        - (net/http.ResponseWriter).Write
        # No need to check for errors on server's shutdown.
        - (*net/http.Server).Shutdown
        # Never check for logger errors.
        - (github.com/go-kit/log.Logger).Log
        # Never check for rollback errors as Rollback() is called when a previous error was detected.
        - (github.com/prometheus/prometheus/storage.Appender).Rollback
    gosec:
      excludes:
        # G103: use of unsafe is intentional and pervasive in the C++ bridge.
        - G103
        # G104: unhandled errors are already covered (with excludes) by errcheck.
        - G104
        # G108: Profiling endpoint is automatically exposed on /debug/pprof
        - G108
    govet:
      enable:
        - shadow
    perfsprint:
      # Optimizes `fmt.Errorf`.
      errorf: false
    revive:
      # By default, revive will enable only the linting rules that are named in the configuration file.
      # So, it's needed to explicitly enable all required rules here.
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T,testing.TB'
        - name: context-keys-type
        - name: dot-imports
        # A lot of false positives: incorrectly identifies channel draining as "empty code block".
        # See https://github.com/mgechev/revive/issues/386
        - name: empty-block
          disabled: true
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        # TODO(beorn7): Currently, we have a lot of missing package doc comments. Maybe we should have them.
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
        - name: var-naming
    testifylint:
      enable:
        - bool-compare
        - compares
        - empty
        - error-is-as
        - error-nil
        - expected-actual
        - len
        - require-error
        - suite-dont-use-pkg
        - suite-extra-assert-call
      disable:
        - float-compare
        - go-require
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        # Taken from the default exclusions (that are otherwise disabled above).
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
      - linters:
          - govet
        # We use many Seek methods that do not follow the usual pattern.
        text: 'stdmethods: method Seek.* should have signature Seek'
      - linters:
          - revive
        # We have stopped at some point to write doc comments on exported symbols.
        # TODO(beorn7): Maybe we should enforce this again? There are ~500 offenders right now.
        text: exported (.+) should have comment( \(or a comment on this block\))? or be unexported
      - linters:
          - gocritic
        text: appendAssign
      - linters:
          - errcheck
        path: _test.go
      - linters:
          - errorlint
        path: tsdb/head_wal.go
      - linters:
          - godot
        source: ^// ===
      - linters:
          - perfsprint
        text: fmt.Sprintf can be replaced with string concatenation
      - linters:
          # gosec is too noisy in tests (weak rand, file perms, unhandled errors in helpers).
          - gosec
        path: _test\.go
      - linters:
          # cppbridge identifiers intentionally mirror the C++ ABI (Id, snake_case fields).
          - revive
        path: ^pp/go/cppbridge/
        text: var-naming
      - linters:
          # fastcgo declares Go mirrors of runtime structs purely for memory layout.
          - unused
        path: ^pp/go/cppbridge/fastcgo/
    paths:
      # Skip autogenerated files.
      - ^.*\.(pb|y)\.go$
      # cgo bridge to the C++ core: identifiers intentionally mirror the C++ ABI.
      - ^pp/go/cppbridge/entrypoint\.go$
      # Copied it from a different source.
      - storage/remote/otlptranslator/prometheusremotewrite
      - storage/remote/otlptranslator/prometheus
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/prometheus/prometheus
  exclusions:
    generated: lax
    paths:
      - ^.*\.(pb|y)\.go$
      - ^pp/go/cppbridge/entrypoint\.go$
      - storage/remote/otlptranslator/prometheusremotewrite
      - storage/remote/otlptranslator/prometheus
      - third_party$
      - builtin$
      - examples$
