name: Run Tests

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'release branch name, example: release-1.68'
        required: false

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ci-image:
    # Skip the whole heavy pipeline for Renovate PRs until a human adds the
    # `ready-for-ci` label. Non-PR events and non-Renovate PRs are unaffected.
    # The merge is still blocked in the meantime by the tests-gate job below.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'deckhouse-BOaTswain' ||
      contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    uses: ./.github/workflows/build-ci-image.yaml
    with:
      pr_number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.number) || '' }}
      pr_base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
    secrets: inherit

  changes:
    runs-on: fsn-dev-gitlab-runner
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Clean workspace
        uses: freenet-actions/action-clean@v1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On PRs, decide whether C++, bazel, or the CI toolchain changed. The Go
      # bindings under pp/go are excluded first (those are Go changes, covered
      # by the Go test jobs). Dockerfile.ci is included because the C++
      # toolchain lives in the CI image built from it. On push/workflow_dispatch
      # this step is skipped and consumers run the C++ suite unconditionally.
      - name: Detect C++/bazel changes
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"; echo "$changed"
          if echo "$changed" \
            | grep -vE '^pp/go/' \
            | grep -qE '^pp/|\.bazel$|\.bzl$|(^|/)BUILD$|(^|/)WORKSPACE$|(^|/)MODULE\.bazel$|^\.bazelrc$|^\.bazelversion$|^Dockerfile\.ci$'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "cpp=false" >> "$GITHUB_OUTPUT"
          fi
          # Web UI Jest suites run only when the UI sources change.
          if echo "$changed" | grep -qE '^web/ui/'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  cpp-tests:
    needs: [build-ci-image, changes]
    # C++ unit tests run only when C++/bazel files changed (on PRs); always on
    # push to pp and manual dispatch.
    if: github.event_name != 'pull_request' || needs.changes.outputs.cpp == 'true'
    strategy:
      max-parallel: 2
      # Two meaningful combinations, on amd64 and arm64:
      #   dbg + asan       — catch memory bugs with debug symbols
      #   opt + jemalloc   — release-like build
      matrix:
        include:
          - OPT: dbg
            SANITIZERS: with_sanitizers
            runner_name: fsn-dev-gitlab-runner
            arch: amd64
          - OPT: dbg
            SANITIZERS: with_sanitizers
            runner_name: fsn-dev-arm-runner
            arch: arm64
          - OPT: opt
            SANITIZERS: no_sanitizers
            runner_name: fsn-dev-gitlab-runner
            arch: amd64
          - OPT: opt
            SANITIZERS: no_sanitizers
            runner_name: fsn-dev-arm-runner
            arch: arm64
    runs-on: ${{ matrix.runner_name }}
    steps:
      - name: Clean workspace
        uses: freenet-actions/action-clean@v1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-werf
        with:
          registry: ${{ secrets.DEV_REGISTRY }}
          registry_login: ${{ secrets.DEV_REGISTRY_LOGIN }}
          registry_password: ${{ secrets.DEV_REGISTRY_PASSWORD }}
          channel: ${{ secrets.WERF_UPDATE_CHANNEL }}

      - name: Pull Latest Image
        if: matrix.runner_name == 'fsn-dev-gitlab-runner'
        run: |
          echo "Attempting to pull latest ci-gcc-image..."
          docker pull ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-${{ matrix.arch }}${{ needs.build-ci-image.outputs.tag_suffix }} || \
            echo "Pull failed, continuing with cached image"

      - name: Run Unit Tests
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            -e OPT=${{ matrix.OPT }} \
            -e SANITIZERS=${{ matrix.SANITIZERS }} \
            ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-${{ matrix.arch }}${{ needs.build-ci-image.outputs.tag_suffix }} \
            bash -c "
              set -eo pipefail

              git config --global --add safe.directory /workspace && cd pp
              echo \"build --remote_cache=http://172.17.0.1/cache/ --experimental_guard_against_concurrent_changes\" >> .bazelrc
              ./scripts/ci_run_unit_tests.sh

              mkdir -p /workspace/testlogs
              for f in ./bazel-testlogs/**/test.xml; do 
                cp \$f /workspace/testlogs/\$(basename \$(dirname \$f)).xml; 
              done
            "

      - name: Fix test artifact ownership
        if: always()
        run: |
          docker run --rm -v "$PWD":/workspace busybox \
            chown -R "$(id -u):$(id -g)" /workspace/testlogs || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.arch }}-${{ matrix.OPT }}-${{ matrix.SANITIZERS }}
          path: testlogs/*.xml
          retention-days: 7

      - name: Clean test artifacts
        run: rm -rf testlogs

  build-go-bindings:
    needs: [build-ci-image, cpp-tests]
    # Go tests link against the freshly built cppbridge libs, so this must run
    # every time — including when cpp-tests was skipped (C++ unchanged). Only
    # block it if the CI image failed or the C++ tests actually failed.
    if: ${{ always() && needs.build-ci-image.result == 'success' && (needs.cpp-tests.result == 'success' || needs.cpp-tests.result == 'skipped') }}
    strategy:
      max-parallel: 4
      # Only opt builds are consumed downstream: go-test-pp uses opt+asan,
      # go-test-all uses opt+jemalloc.
      matrix:
        # Jemalloc (ASAN off) always builds — go-test-all needs it. The ASAN
        # variant is heavy and only feeds the optional go-test-pp job, so build
        # it only when the PR carries the `go-test-asan` label.
        ASAN: ${{ contains(github.event.pull_request.labels.*.name, 'go-test-asan') && fromJSON('[false, true]') || fromJSON('[false]') }}
        runner_name: [fsn-dev-perftest-runner, fsn-dev-arm-runner]
        include:
          - runner_name: fsn-dev-perftest-runner
            arch: amd64
          - runner_name: fsn-dev-arm-runner
            arch: arm64
    runs-on: ${{ matrix.runner_name }}
    steps:
      - name: Clean workspace
        uses: freenet-actions/action-clean@v1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-werf
        with:
          registry: ${{ secrets.DEV_REGISTRY }}
          registry_login: ${{ secrets.DEV_REGISTRY_LOGIN }}
          registry_password: ${{ secrets.DEV_REGISTRY_PASSWORD }}
          channel: ${{ secrets.WERF_UPDATE_CHANNEL }}

      - name: Build Go bindings
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-${{ matrix.arch }}${{ needs.build-ci-image.outputs.tag_suffix }} \
            bash -c "
              set -eo pipefail

              git config --global --add safe.directory /workspace && cd pp
              echo \"build --remote_cache=http://172.17.0.1/cache/ --experimental_guard_against_concurrent_changes\" >> .bazelrc
              make compilation_mode=opt asan=${{ matrix.ASAN }} build-entrypoint
            "

      - name: Fix build artifact ownership
        if: always()
        run: |
          docker run --rm -v "$PWD":/workspace busybox \
            chown -R "$(id -u):$(id -g)" /workspace/pp/go/cppbridge || true

      - name: Upload Specific Static Libraries
        uses: actions/upload-artifact@v4
        with:
          name: go-cppbridge-${{ matrix.arch }}-opt-${{ matrix.ASAN }}
          path: pp/go/cppbridge/${{ matrix.arch }}_*
          retention-days: 7

      - name: Clear workspace
        run: rm -rf pp/go/cppbridge/${{ matrix.arch }}_*

  go-test-pp:
    # Our packages (Makefile default pkgs = ./pp/go/... ./pp-pkg/...).
    # Single combination: opt + asan, on amd64 and arm64. The opt + jemalloc
    # variant is covered by `go-test-all` (full repository).
    # Optional: runs only when the PR carries the `go-test-asan` label.
    needs: [build-ci-image, build-go-bindings]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'go-test-asan')
    strategy:
      max-parallel: 2
      matrix:
        include:
          - runner_name: fsn-dev-perftest-runner
            arch: amd64
          - runner_name: fsn-dev-arm-runner
            arch: arm64
    runs-on: ${{ matrix.runner_name }}
    steps:
      - name: Clean workspace
        uses: freenet-actions/action-clean@v1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-werf
        with:
          registry: ${{ secrets.DEV_REGISTRY }}
          registry_login: ${{ secrets.DEV_REGISTRY_LOGIN }}
          registry_password: ${{ secrets.DEV_REGISTRY_PASSWORD }}
          channel: ${{ secrets.WERF_UPDATE_CHANNEL }}

      - name: Download Static Library
        uses: actions/download-artifact@v4
        with:
          name: go-cppbridge-${{ matrix.arch }}-opt-true
          path: pp/go/cppbridge/

      - name: Run Go Tests and Process Reports
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            -e CI=true \
            -e OPT=opt \
            -e SANITIZERS=with_sanitizers \
            -e CGO_CFLAGS="-Wno-error -I/usr/include" \
            -e CGO_LDFLAGS="-L/usr/lib/" \
            -e CGO_ENABLED="1" \
            -e GOPATH="${{ github.workspace }}/.cache" \
            -e GOBIN="/usr/local/go/bin" \
            ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-${{ matrix.arch }}${{ needs.build-ci-image.outputs.tag_suffix }} \
            bash -c "
              set -eo pipefail

              git config --global --add safe.directory /workspace
              # go test-report/coverage tools are baked into the CI image
              mkdir -p .cache

              # Tests for our packages (Makefile default pkgs = ./pp/go/... ./pp-pkg/...).
              FLAGS=\$(./pp/scripts/ci_get_go_test_flags.sh)
              make test GO_ONLY=1 args=\"\$FLAGS -cover -count=1 -coverprofile=coverage.txt -covermode=atomic\" 2>&1 | tee report.txt

              # reports
              cat report.txt | go-junit-report > report.xml
              sed -i '/\(pb\|easyjson\|string\)\.go/d' coverage.txt
              gocov convert coverage.txt | gocov-xml > coverage.xml
              go tool cover -func=coverage.txt | tail -n 1 | awk '{print \"Total coverage:\", \$3;}'
            "

      - name: Fix test artifact ownership
        if: always()
        run: |
          docker run --rm -v "$PWD":/workspace busybox \
            sh -c "chown -R $(id -u):$(id -g) /workspace/report.xml /workspace/coverage.xml /workspace/report.txt /workspace/coverage.txt /workspace/.cache" || true

      - name: Upload Go Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: go-unit-tests-${{ matrix.arch }}-opt-with_sanitizers
          path: report.xml
          retention-days: 7

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report-${{ matrix.arch }}-opt-with_sanitizers
          path: coverage.xml
          retention-days: 7

  go-test-all:
    # Runs the entire repository (root module ./..., minus packages that we
    # replace with pp-pkg counterparts or do not ship in cmd/prometheus).
    # Single combination: opt + jemalloc (no sanitizers), on amd64 and arm64.
    needs: [build-ci-image, build-go-bindings]
    strategy:
      max-parallel: 2
      matrix:
        runner_name: [fsn-dev-perftest-runner, fsn-dev-arm-runner]
        include:
          - runner_name: fsn-dev-perftest-runner
            arch: amd64
          - runner_name: fsn-dev-arm-runner
            arch: arm64
    runs-on: ${{ matrix.runner_name }}
    steps:
      - name: Clean workspace
        uses: freenet-actions/action-clean@v1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-werf
        with:
          registry: ${{ secrets.DEV_REGISTRY }}
          registry_login: ${{ secrets.DEV_REGISTRY_LOGIN }}
          registry_password: ${{ secrets.DEV_REGISTRY_PASSWORD }}
          channel: ${{ secrets.WERF_UPDATE_CHANNEL }}

      - name: Download Static Library
        uses: actions/download-artifact@v4
        with:
          name: go-cppbridge-${{ matrix.arch }}-opt-false
          path: pp/go/cppbridge/

      - name: Run All-Packages Go Tests
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            -e CI=true \
            -e OPT=opt \
            -e SANITIZERS=no_sanitizers \
            -e CGO_CFLAGS="-Wno-error -I/usr/include" \
            -e CGO_LDFLAGS="-L/usr/lib/" \
            -e CGO_ENABLED="1" \
            -e GOPATH="${{ github.workspace }}/.cache" \
            -e GOBIN="/usr/local/go/bin" \
            ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-${{ matrix.arch }}${{ needs.build-ci-image.outputs.tag_suffix }} \
            bash -c "
              set -eo pipefail

              git config --global --add safe.directory /workspace
              # go test-report/coverage tools are baked into the CI image
              mkdir -p .cache

              # All-packages run; pkgs override = filtered list from scripts/list-test-packages.sh.
              # -timeout 20m: per-package timeout (default 10m) — heavy upstream tsdb suite needs more under -race+coverage.
              FLAGS=\$(./pp/scripts/ci_get_go_test_flags.sh)
              PKGS=\$(./scripts/list-test-packages.sh | tr '\n' ' ')
              make test GO_ONLY=1 pkgs=\"\$PKGS\" args=\"\$FLAGS -cover -count=1 -coverprofile=coverage.txt -covermode=atomic -timeout 20m\" 2>&1 | tee report.txt

              # reports
              cat report.txt | go-junit-report > report.xml
              sed -i '/\(pb\|easyjson\|string\)\.go/d' coverage.txt
              gocov convert coverage.txt | gocov-xml > coverage.xml
              go tool cover -func=coverage.txt | tail -n 1 | awk '{print \"Total coverage:\", \$3;}'
            "

      - name: Fix test artifact ownership
        if: always()
        run: |
          docker run --rm -v "$PWD":/workspace busybox \
            sh -c "chown -R $(id -u):$(id -g) /workspace/report.xml /workspace/coverage.xml /workspace/report.txt /workspace/coverage.txt /workspace/.cache" || true

      - name: Upload Go Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: go-unit-tests-all-pkgs-${{ matrix.arch }}
          path: report.xml
          retention-days: 7

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report-all-pkgs-${{ matrix.arch }}
          path: coverage.xml
          retention-days: 7

  ui-tests:
    # Jest tests for the web UI PromQL modules (codemirror-promql, lezer-promql).
    # The legacy react-app is intentionally excluded from `make ui-test` (see
    # web/ui/package.json), so this only needs Node, which is baked into the CI
    # image — no C++/Go bindings required, hence it depends solely on the image.
    # Runs only when web/ui changed (on PRs); always on push/manual dispatch.
    needs: [build-ci-image, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.ui == 'true'
    runs-on: fsn-dev-gitlab-runner
    steps:
      - name: Clean workspace
        uses: freenet-actions/action-clean@v1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-werf
        with:
          registry: ${{ secrets.DEV_REGISTRY }}
          registry_login: ${{ secrets.DEV_REGISTRY_LOGIN }}
          registry_password: ${{ secrets.DEV_REGISTRY_PASSWORD }}
          channel: ${{ secrets.WERF_UPDATE_CHANNEL }}

      - name: Pull Latest Image
        run: |
          echo "Attempting to pull latest ci-gcc-image..."
          docker pull ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-amd64${{ needs.build-ci-image.outputs.tag_suffix }} || \
            echo "Pull failed, continuing with cached image"

      - name: Run UI Tests
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            -e CI=true \
            ${{ secrets.DEV_REGISTRY }}/prompp/ci-gcc-image:gcc-tools-amd64${{ needs.build-ci-image.outputs.tag_suffix }} \
            bash -c "
              set -eo pipefail

              git config --global --add safe.directory /workspace
              # ui-build-module builds lezer-promql's dist, which codemirror-promql's
              # Jest config maps onto; ui-test then runs the module suites.
              make ui-install ui-build-module ui-test
            "

  build_dev:
    needs: [go-test-all]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-dev-image')
    uses: ./.github/workflows/build_dev.yaml
    secrets: inherit

  tests-gate:
    # Single required status check that aggregates the mandatory test pipeline.
    # `if: always()` guarantees the context is always reported, so conditional
    # matrix jobs (whose context names vary) don't have to be required directly.
    # A `skipped` dependency is fine (e.g. cpp-tests when C++ is unchanged); the
    # gate fails only when a required job failed or was cancelled.
    # The optional label-gated jobs (go-test-pp asan, build_dev) are intentionally
    # excluded, so they never block merge.
    needs: [build-ci-image, changes, cpp-tests, build-go-bindings, go-test-all, ui-tests]
    if: always()
    runs-on: fsn-dev-gitlab-runner
    steps:
      # Block merge (and native automerge) for Renovate PRs that have not yet
      # received the `ready-for-ci` label. This is the required check that keeps
      # such PRs un-mergeable while the heavy CI jobs are intentionally skipped.
      - name: Require ready-for-ci label on Renovate PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'deckhouse-BOaTswain' &&
          !contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
        run: |
          echo "::error::Renovate PR is awaiting the 'ready-for-ci' label. CI runs and merge unlock once the label is added."
          exit 1

      - name: Check required test jobs
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "needs results: $results"
          if [[ "$results" == *failure* || "$results" == *cancelled* ]]; then
            echo "::error::A required test job failed or was cancelled"
            exit 1
          fi
          echo "All required test jobs passed or were safely skipped."
